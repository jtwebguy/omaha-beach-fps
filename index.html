<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omaha Beach 1944 — FPS Prototype</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="menu">
    <div class="panel">
      <h1>OMAHA BEACH</h1>
      <h2>June 6, 1944 — Dog Green Sector</h2>
      <p id="loading">Loading assets…</p>
      <button id="play" disabled>DEPLOY</button>
      <div class="controls">
        <div><b>WASD</b> move</div><div><b>Mouse</b> aim</div>
        <div><b>Click</b> fire</div><div><b>Right-click</b> aim down sights</div>
        <div><b>R</b> reload</div><div><b>Shift</b> sprint</div>
        <div><b>C</b> crouch</div><div><b>Space</b> jump</div>
      </div>
      <p class="goal">Eliminate the enemy soldiers on the beach and bluff.</p>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div id="crosshair"></div>
    <div id="hitmarker"></div>
    <div id="damage"></div>
    <div id="health"><span>HEALTH</span><div class="bar"><div id="healthFill"></div></div></div>
    <div id="ammo"><span id="ammoMag">8</span> / <span id="ammoReserve">48</span><small>M1 GARAND</small></div>
    <div id="objective">Enemies remaining: <span id="enemyCount">0</span></div>
    <div id="message"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
